{% extends "base.html" %}

{% block title %}OTP Verification - Xchange{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0" style="border-radius: 16px;">
            <div class="card-header text-center" style="background: var(--bg-card); padding: 30px 20px 10px; border-bottom: none;">
                <h3 class="card-title mb-1" style="font-size: 24px;">OTP Required</h3>
                <p class="text-muted" style="font-size: 14px;">Enter token from your authenticator app</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="otp_token" class="form-label text-muted" style="font-size: 14px; font-weight: 500;">OTP Token</label>
                        <input type="text" id="otp_token" name="otp_token" class="form-control form-control-lg" maxlength="6" required placeholder="123456" autocomplete="one-time-code">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" style="font-size: 16px; border-radius: 8px;">Verify</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
