{% extends "base.html" %}

{% block title %}Log In - Xchange{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0" style="border-radius: 16px;">
            <div class="card-header text-center" style="background: var(--bg-card); padding: 30px 20px 10px; border-bottom: none;">
                <h3 class="card-title mb-1" style="font-size: 24px;">Welcome Back</h3>
                <p class="text-muted" style="font-size: 14px;">Sign in to your Xchange account</p>
            </div>
            <div class="card-body p-4">
                
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_login" class="form-label text-muted" style="font-size: 14px; font-weight: 500;">Username or Email</label>
                        <input type="text" name="login" class="form-control form-control-lg" placeholder="Enter your username or email" autocomplete="username" maxlength="150" required id="id_login" style="font-size: 15px;">
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="id_password" class="form-label text-muted mb-0" style="font-size: 14px; font-weight: 500;">Password</label>
                            <span class="text-muted" style="font-size: 13px;">Use your username or email</span>
                        </div>
                        <input type="password" name="password" class="form-control form-control-lg mt-2" placeholder="Enter your password" autocomplete="current-password" required id="id_password" style="font-size: 15px;">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2" style="font-size: 16px; border-radius: 8px;">Log In</button>
                    
                    {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}" />
                    {% endif %}
                </form>

                <div class="text-center mt-4" style="font-size: 14px;">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="{% url 'signup' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
